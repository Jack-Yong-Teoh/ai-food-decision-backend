services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-decision-backend-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      REDIS_HOST: redis
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
      uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - food-decision-network

  db:
    image: postgres:16-alpine
    container_name: food-decision-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dbuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_DATABASE:-ai-food-decision-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-dbuser} -d ${DB_DATABASE:-ai-food-decision-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - food-decision-network

  redis:
    image: redis:7-alpine
    container_name: food-decision-backend-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
      exec redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - food-decision-network

volumes:
  postgres_data:
  redis_data:

networks:
  food-decision-network:
    driver: bridge
